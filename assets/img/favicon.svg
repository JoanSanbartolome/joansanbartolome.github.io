  <!-- Fondo oscuro -->
  <rect width="64" height="64" rx="14" fill="#08070a"/>
  <!-- Patillas del chip -->
  <g fill="#c2410c">
    <rect x="20" y="5" width="5" height="9" rx="1.5"/>
    <rect x="29.5" y="5" width="5" height="9" rx="1.5"/>
    <rect x="39" y="5" width="5" height="9" rx="1.5"/>
    <rect x="20" y="50" width="5" height="9" rx="1.5"/>
    <rect x="29.5" y="50" width="5" height="9" rx="1.5"/>
    <rect x="39" y="50" width="5" height="9" rx="1.5"/>
    <rect x="5" y="20" width="9" height="5" rx="1.5"/>
    <rect x="5" y="29.5" width="9" height="5" rx="1.5"/>
    <rect x="5" y="39" width="9" height="5" rx="1.5"/>
    <rect x="50" y="20" width="9" height="5" rx="1.5"/>
    <rect x="50" y="29.5" width="9" height="5" rx="1.5"/>
    <rect x="50" y="39" width="9" height="5" rx="1.5"/>
